<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6f4e"><title>植物样方数据恢复 V5.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#1d2a22;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #dfe7e1;border-radius:16px;padding:16px;margin:12px 0}h1{font-size:22px;margin:4px 0 8px}.sub{font-size:13px;color:#66746b;line-height:1.65}.warn{background:#fff1bf;border-radius:12px;padding:12px;line-height:1.65;font-size:13px}.ok{background:#e7f4eb;color:#246b45}.bad{background:#fdeaea;color:#9f3030}.status{border-radius:12px;padding:12px;margin-top:10px;line-height:1.6;font-weight:700;display:none}textarea{width:100%;min-height:210px;padding:12px;border:1px solid #cbd6ce;border-radius:12px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px 12px;margin-top:9px;font:700 15px/1.2 inherit;text-align:center;text-decoration:none}.primary{background:#2f6f4e;color:#fff}.soft{background:#e7f2eb;color:#2f6f4e}.disabled{opacity:.45;pointer-events:none}.summary{margin-top:10px;font-size:14px;line-height:1.7}.tiny{font-size:12px;color:#748078;line-height:1.6}</style></head><body><div class="wrap"><h1>🚑 植物样方数据恢复 V5.0</h1><div class="sub">这是一个完全独立的恢复页面，不加载语音、Excel或主程序，因此不会被主页面的自动保存覆盖。专门用于把微信里的备份安全转移到系统浏览器。</div><div class="card"><div class="warn"><b>原微信数据不会被这里删除。</b> 请先把微信里复制出来的备份码另存到微信收藏/备忘录，确认保存后再继续。此页面兼容 V4.8、V4.9 备份码以及原始 JSON。</div></div><div class="card"><b>第1步：粘贴完整备份码</b><textarea id="code" placeholder="把从微信复制的整段备份码粘贴到这里……"></textarea><button id="check" class="soft">🔍 检查备份是否完整</button><div id="status" class="status"></div><div id="summary" class="summary"></div></div><div class="card"><b>第2步：确认写入当前浏览器</b><div class="tiny">只有“检查通过”后，下面按钮才会启用。恢复时会先备份当前浏览器已有数据，再写入微信备份。</div><button id="restore" class="primary disabled">✅ 恢复并进入主页面</button><a class="btn soft" href="./">返回主页面</a></div></div><script>(function(){'use strict';var KEY='plant_recorder_v46',P48='PLANT-RECORDER-BACKUP-V48:',P49='PLANT-RECORDER-BACKUP-V49:',last=null;function E(id){return document.getElementById(id)}function setStatus(text,ok){var s=E('status');s.style.display='block';s.className='status '+(ok?'ok':'bad');s.textContent=text}function b64ToUtf8(s){var bin=atob(s),len=bin.length,bytes=new Uint8Array(len),i;for(i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);if(window.TextDecoder)return new TextDecoder('utf-8').decode(bytes);var esc='';for(i=0;i<len;i++)esc+='%'+('0'+bytes[i].toString(16)).slice(-2);return decodeURIComponent(esc)}function validate(raw){var obj=JSON.parse(raw);if(!obj||!obj.grids||!Array.isArray(obj.grids)||!obj.grids.length)throw new Error('没有找到有效的网格数据');var roads=0,sites=0,samples=0,records=0,i,j,k,l,g,r,st,sp;for(i=0;i<obj.grids.length;i++){g=obj.grids[i];if(!Array.isArray(g.roads))continue;roads+=g.roads.length;for(j=0;j<g.roads.length;j++){r=g.roads[j];if(!Array.isArray(r.sites))continue;sites+=r.sites.length;for(k=0;k<r.sites.length;k++){st=r.sites[k];if(!Array.isArray(st.samples))continue;samples+=st.samples.length;for(l=0;l<st.samples.length;l++){sp=st.samples[l];records+=Array.isArray(sp.records)?sp.records.length:0}}}}return{raw:raw,obj:obj,grids:obj.grids.length,roads:roads,sites:sites,samples:samples,records:records}}function parse(input){var t=String(input||'').replace(/^\uFEFF/,'').trim(),p,raw;if(!t)throw new Error('还没有粘贴备份码');if(t.charAt(0)==='"'&&t.charAt(t.length-1)==='"'){try{t=JSON.parse(t)}catch(e){}}if(t.indexOf(P49)===0){p=t.substring(P49.length).replace(/\s+/g,'');raw=b64ToUtf8(p);return validate(raw)}if(t.indexOf(P48)===0){p=t.substring(P48.length).replace(/\s+/g,'');try{return validate(decodeURIComponent(p))}catch(e1){throw new Error('V4.8备份码可能没有完整复制，请重新全选复制')}}try{return validate(t)}catch(e2){}try{return validate(decodeURIComponent(t.replace(/\s+/g,'')))}catch(e3){}throw new Error('无法识别备份码，请确认从开头到结尾完整复制')}function inspect(){last=null;E('restore').className='primary disabled';E('summary').textContent='';try{var info=parse(E('code').value);last=info;setStatus('✅ 检查通过，备份是完整的。',true);E('summary').innerHTML='<b>'+info.grids+'</b> 个网格 · <b>'+info.roads+'</b> 条道路 · <b>'+info.sites+'</b> 个样地 · <b>'+info.samples+'</b> 个样方 · <b>'+info.records+'</b> 条植物记录';E('restore').className='primary';return info}catch(e){setStatus('❌ 检查失败：'+e.message,false);return null}}function restore(){if(!last){last=inspect();if(!last)return}try{var before=localStorage.getItem(KEY)||'';if(before)localStorage.setItem('plant_recorder_before_rescue_v50',before);localStorage.setItem('plant_recorder_restored_backup_v50',last.raw);localStorage.setItem(KEY,last.raw);var check=localStorage.getItem(KEY);if(check!==last.raw)throw new Error('浏览器拒绝写入本地数据');var verify=validate(check);setStatus('✅ 已写入成功：'+verify.grids+'个网格、'+verify.sites+'个样地、'+verify.records+'条植物记录。现在进入主页面。',true);E('restore').textContent='✅ 已恢复，正在进入…';E('restore').className='primary disabled';setTimeout(function(){location.replace('./?restored=50&t='+Date.now())},350)}catch(e){setStatus('❌ 恢复失败：'+e.message,false)}}E('check').onclick=inspect;E('restore').onclick=restore;E('code').addEventListener('paste',function(){setTimeout(inspect,100)});})();</script></body></html>
