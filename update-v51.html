<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>更新到V5.1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f7f4;color:#1d2a22;margin:0}.wrap{max-width:640px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #dfe7e1;border-radius:16px;padding:18px}.big{font-size:22px;font-weight:800;margin-bottom:10px}.sub{font-size:14px;line-height:1.7;color:#66746b}.ok{margin-top:16px;padding:12px;border-radius:12px;background:#e7f4eb;color:#246b45;font-weight:700}</style></head><body><div class="wrap"><div class="card"><div class="big">🌿 正在切换到 V5.1</div><div class="sub">这里只会清理网页缓存和旧 Service Worker，<b>不会清除你已经录入的网格、道路、样地、样方或植物记录。</b></div><div id="msg" class="ok">正在刷新程序文件……</div></div></div><script>(function(){var msg=document.getElementById('msg');function go(){msg.textContent='✅ 缓存已处理，正在打开 V5.1……';setTimeout(function(){location.replace('./?v=51&fresh='+Date.now())},300)}var jobs=[];try{if('serviceWorker' in navigator){jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}))}}catch(e){}try{if(window.caches){jobs.push(caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k)}))}))}}catch(e2){}if(jobs.length){Promise.all(jobs).then(go).catch(go)}else go()})();</script></body></html>
