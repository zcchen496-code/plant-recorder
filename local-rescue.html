<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>植物样方本机数据抢救</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#1d2a22;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #dfe7e1;border-radius:16px;padding:15px;margin:12px 0}h1{font-size:22px;margin:4px 0 8px}.sub{font-size:13px;color:#66746b;line-height:1.7}.warn{background:#fff1bf;border-radius:12px;padding:12px;line-height:1.65;font-size:13px}.item{border:1px solid #dfe7e1;border-radius:13px;padding:12px;margin:10px 0}.best{border:2px solid #2f6f4e;background:#f7fbf8}.name{font-weight:800;word-break:break-all}.meta{font-size:13px;line-height:1.7;margin:5px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.btn,button,a{border:0;border-radius:10px;padding:10px 12px;font-weight:700;text-decoration:none;text-align:center}.primary{background:#2f6f4e;color:#fff}.soft{background:#e7f2eb;color:#2f6f4e}.bad{color:#9f3030}.good{color:#246b45}.status{margin-top:10px;padding:10px;border-radius:10px;background:#eef4ef;font-size:13px;line-height:1.6}</style></head><body><div class="wrap"><h1>🚑 本机数据抢救</h1><div class="sub">这个页面不会启动主程序，也不会自动保存空白数据。它只检查当前浏览器里残留的主数据、自动快照和历史备份。</div><div class="card"><div class="warn"><b>先不要继续录入、不要清浏览器数据、不要使用“清理加速”。</b> 请一定在“刚才录入数据时使用的同一个浏览器、同一个网址域名”里打开本页。如果当时用的是 GitHub Pages，就在 GitHub Pages 里抢救；如果当时用的是 Vercel，GitHub 页面看不到那边的数据。</div></div><div class="card"><div class="row"><button id="scan" class="primary">重新扫描本机数据</button><a class="btn soft" href="./">返回主页面</a></div><div id="status" class="status">正在扫描……</div><div id="list"></div></div></div><script>(function(){'use strict';var KEY='plant_recorder_v46';var known=['plant_recorder_v46','plant_recorder_snapshot_1','plant_recorder_snapshot_2','plant_recorder_snapshot_3','plant_recorder_before_restore_v49','plant_recorder_restore_copy_v49','plant_recorder_before_rescue_v50','plant_recorder_restored_backup_v50','plant_recorder_v45','plant_recorder_v44','plant_recorder_v4'];function E(id){return document.getElementById(id)}function stats(raw){var o=JSON.parse(raw);if(!o||!Array.isArray(o.grids))return null;var roads=0,sites=0,samples=0,records=0,i,j,k,l;for(i=0;i<o.grids.length;i++){var g=o.grids[i];if(!Array.isArray(g.roads))continue;roads+=g.roads.length;for(j=0;j<g.roads.length;j++){var r=g.roads[j];if(!Array.isArray(r.sites))continue;sites+=r.sites.length;for(k=0;k<r.sites.length;k++){var s=r.sites[k];if(!Array.isArray(s.samples))continue;samples+=s.samples.length;for(l=0;l<s.samples.length;l++){records+=Array.isArray(s.samples[l].records)?s.samples[l].records.length:0}}}}return{raw:raw,grids:o.grids.length,roads:roads,sites:sites,samples:samples,records:records,score:records*100000+samples*1000+sites*10+o.grids.length}}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function copyRaw(raw){var code='PLANT-RECORDER-BACKUP-V49:'+utf8ToB64(raw);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(function(){alert('✅ 这份数据已复制成备份码，请先保存到备忘录/微信收藏。')},function(){prompt('请全选复制下面的备份码：',code)})}else prompt('请全选复制下面的备份码：',code)}function utf8ToB64(str){if(window.TextEncoder){var bytes=new TextEncoder().encode(str),bin='',i,step=8192;for(i=0;i<bytes.length;i+=step)bin+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+step,bytes.length)));return btoa(bin)}return btoa(unescape(encodeURIComponent(str)))}function restore(raw,st){if(!confirm('确定恢复这份数据吗？\n'+st.grids+'个网格、'+st.sites+'个样地、'+st.records+'条植物记录'))return;try{var cur=localStorage.getItem(KEY)||'';if(cur)localStorage.setItem('plant_recorder_before_local_rescue_'+Date.now(),cur);localStorage.setItem('plant_recorder_manual_rescue_copy_'+Date.now(),raw);localStorage.setItem(KEY,raw);var check=stats(localStorage.getItem(KEY)||'');if(!check||check.records!==st.records||check.sites!==st.sites)throw new Error('写入后二次校验不一致');alert('✅ 恢复成功。将进入主页面。');location.replace('./?rescued='+Date.now())}catch(e){alert('恢复失败：'+e.message)}}function scan(){var found=[],seen={},i,k,raw,st;try{for(i=0;i<known.length;i++){k=known[i];raw=localStorage.getItem(k);if(raw&&!seen[raw]){seen[raw]=1;try{st=stats(raw);if(st){st.key=k;found.push(st)}}catch(e){}}}for(i=0;i<localStorage.length;i++){k=localStorage.key(i);if(!k||known.indexOf(k)>=0)continue;if(k.indexOf('plant_recorder_')!==0)continue;raw=localStorage.getItem(k);if(raw&&!seen[raw]){seen[raw]=1;try{st=stats(raw);if(st){st.key=k;found.push(st)}}catch(e2){}}}}catch(e3){E('status').innerHTML='<span class="bad">无法读取本机存储：'+esc(e3.message)+'</span>';return}found.sort(function(a,b){return b.score-a.score});var box=E('list');box.innerHTML='';if(!found.length){E('status').innerHTML='<span class="bad">❌ 当前这个浏览器/网址下没有找到可识别的调查数据。</span><br>这通常表示你现在打开的不是刚才录入时的同一个浏览器或同一个域名。';return}E('status').innerHTML='<span class="good">✅ 找到 '+found.length+' 份候选数据。</span> 已按“植物记录数→样方数→样地数”从多到少排列。第一份通常最值得抢救。';for(i=0;i<found.length;i++)(function(x,index){var d=document.createElement('div');d.className='item '+(index===0?'best':'');d.innerHTML='<div class="name">'+(index===0?'⭐ 最完整候选：':'')+esc(x.key)+'</div><div class="meta"><b>'+x.grids+'</b>个网格 · <b>'+x.roads+'</b>条道路 · <b>'+x.sites+'</b>个样地 · <b>'+x.samples+'</b>个样方 · <b>'+x.records+'</b>条植物记录</div><div class="row"><button class="soft copy">先复制这份备份</button><button class="primary restore">恢复这份数据</button></div>';d.querySelector('.copy').onclick=function(){copyRaw(x.raw)};d.querySelector('.restore').onclick=function(){restore(x.raw,x)};box.appendChild(d)})(found[i],i)}E('scan').onclick=scan;scan()})();</script></body></html>
